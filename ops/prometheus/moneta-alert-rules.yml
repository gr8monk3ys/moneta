groups:
  - name: moneta-api-availability
    rules:
      - alert: MonetaApiDown
        expr: up{job="moneta-api"} == 0
        for: 3m
        labels:
          severity: critical
          service: moneta-api
        annotations:
          summary: Moneta API is unreachable
          description: No scrape target in job moneta-api has been up for 3 minutes.

      - alert: MonetaReadyProbeFailing
        expr: avg_over_time(probe_success{job="moneta-ready-probe"}[5m]) < 1
        for: 5m
        labels:
          severity: critical
          service: moneta-api
        annotations:
          summary: Moneta readiness probe is failing
          description: The external /ready probe has failed continuously for 5 minutes.

  - name: moneta-api-slo
    rules:
      - alert: MonetaHigh5xxRate
        expr: |
          (
            sum(rate(moneta_http_requests_total{job="moneta-api",status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(moneta_http_requests_total{job="moneta-api"}[5m])), 1)
          ) > 0.05
          and sum(rate(moneta_http_requests_total{job="moneta-api"}[5m])) > 1
        for: 10m
        labels:
          severity: critical
          service: moneta-api
        annotations:
          summary: Moneta 5xx error rate is above 5%
          description: 5xx responses exceeded 5% for 10 minutes at meaningful request volume.

      - alert: MonetaAuthFailureSpike
        expr: |
          (
            sum(rate(moneta_http_requests_total{job="moneta-api",route=~"/api/auth/.*",status_code=~"401|403|429"}[5m]))
            /
            clamp_min(sum(rate(moneta_http_requests_total{job="moneta-api",route=~"/api/auth/.*"}[5m])), 1)
          ) > 0.20
          and sum(rate(moneta_http_requests_total{job="moneta-api",route=~"/api/auth/.*"}[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
          service: moneta-api
        annotations:
          summary: Moneta auth failures are elevated
          description: Auth endpoints are returning 401/403/429 above 20% for 10 minutes.

      - alert: MonetaP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(moneta_http_request_duration_ms_bucket{job="moneta-api"}[5m]))
          ) > 500
        for: 10m
        labels:
          severity: warning
          service: moneta-api
        annotations:
          summary: Moneta p95 latency is above 500ms
          description: p95 request latency has exceeded 500ms for at least 10 minutes.

      - alert: MonetaReadyEndpoint5xx
        expr: sum(rate(moneta_http_requests_total{job="moneta-api",route="/ready",status_code=~"5.."}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          service: moneta-api
        annotations:
          summary: Moneta /ready endpoint is returning failures
          description: /ready has emitted 5xx responses for 5 minutes.
