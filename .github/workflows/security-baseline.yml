name: security-baseline

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 25 * *"  # monthly (minute-safe policy)

permissions: read-all

concurrency:
  group: security-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Baseline CI check
        run: |
          echo "Security baseline workflow is active"
