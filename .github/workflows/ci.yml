permissions: read-all

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - work

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # verify_summary.py writes <stage>.json here; merged by the verify-report job.
  VERIFY_STAGE_DIR: verify-stages

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: moneta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d moneta_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/moneta_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify backend (lint, unit, integration, build, e2e, audit)
        run: npm run verify:backend

      - name: Test-count evidence
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/verify_summary.py unit reports/unit.json
          python3 scripts/verify_summary.py integration reports/integration.json
          python3 scripts/verify_summary.py e2e reports/e2e.json

      - name: Upload VERIFY stage counts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-stage-quality
          path: verify-stages/
          retention-days: 1

  mobile-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify mobile (lint, typecheck, test, audit)
        run: npm run verify:mobile
        working-directory: .

      - name: Test-count evidence
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_summary.py mobile reports/mobile.json
        working-directory: .

      - name: Upload VERIFY stage counts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-stage-mobile-quality
          path: verify-stages/
          retention-days: 1

  final-gate:
    runs-on: ubuntu-latest
    needs:
      - quality
      - mobile-quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: moneta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d moneta_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/moneta_test
      REQUIRE_INTEGRATION_TESTS: 'true'
      REQUIRE_BILLING_RELEASE_CONFIG: 'false'
      REQUIRE_HIGH_RELEASE_POLICY: 'true'
      MOBILE_AUDIT_LEVEL: 'high'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run final verification gate
        run: npm run verify

  verify-report:
    # Merges every job's VERIFY stage counts into one machine-readable artifact for the merge gate
    # (job summaries aren't readable via the REST API). Fails if any expected stage is missing.
    name: Verify Report
    runs-on: ubuntu-latest
    needs: [quality, mobile-quality]
    if: always()

    steps:
      - name: Download stage counts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verify-stage-*
          path: verify-stages
          merge-multiple: true

      - name: Merge into verify-report.json
        env:
          EXPECTED_STAGES: unit integration e2e mobile
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for s in $EXPECTED_STAGES; do
            f="verify-stages/$s.json"
            [ -f "$f" ] || { echo "::error::missing VERIFY stage '$s'"; exit 1; }
            jq -e --arg s "$s" '.stage == $s and ([.tests, .passed, .failed, .skipped] | all(type == "number" and . == floor and . >= 0))
              and (.passed_ids | type == "array" and all(type == "string"))' "$f" > /dev/null \
              || { echo "::error::unparseable VERIFY stage '$s'"; cat "$f"; exit 1; }
          done
          jq -n --arg repo "$REPO" --arg commit "$COMMIT" '{schema: 1, repo: $repo, commit: $commit, stages: [inputs | .passed_ids |= (unique | sort)]}' \
            $(for s in $EXPECTED_STAGES; do echo "verify-stages/$s.json"; done) > verify-report.json
          cat verify-report.json

      - name: Upload verify-report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-report
          path: verify-report.json
          retention-days: 30
