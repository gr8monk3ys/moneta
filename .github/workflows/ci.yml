permissions: read-all

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - work

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: moneta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d moneta_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/moneta_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify backend (lint, unit, integration, build, e2e, audit)
        run: npm run verify:backend

      - name: Test-count evidence
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/verify_summary.py unit reports/unit.json
          python3 scripts/verify_summary.py integration reports/integration.json
          python3 scripts/verify_summary.py e2e reports/e2e.json

  mobile-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify mobile (lint, typecheck, test, audit)
        run: npm run verify:mobile
        working-directory: .

      - name: Test-count evidence
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_summary.py mobile reports/mobile.json
        working-directory: .

  final-gate:
    runs-on: ubuntu-latest
    needs:
      - quality
      - mobile-quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: moneta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d moneta_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/moneta_test
      REQUIRE_INTEGRATION_TESTS: 'true'
      REQUIRE_BILLING_RELEASE_CONFIG: 'false'
      REQUIRE_HIGH_RELEASE_POLICY: 'true'
      MOBILE_AUDIT_LEVEL: 'high'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Run final verification gate
        run: npm run verify
